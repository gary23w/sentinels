[package]
name = "garrett"
version = "1.9.3"
edition = "2021"
license = "MIT"
description = "garrett, the agent of sentinels: a host intrusion sentinel that stops what it catches."
repository = "https://github.com/gary23w/sentinels"
homepage = "https://garrettstimpson.ca/"
documentation = "https://gary23w.github.io/sentinels/"
readme = "../README.md"
keywords = ["sentinels", "security", "intrusion-detection", "agent"]
categories = ["command-line-utilities", "security"]
# The package on crates.io holds what the program is built from: the sources, this file, Cargo.lock and the README.
# The tests and their recorded fixtures stay in the repository.
include = ["/src"]

# cargo binstall garrett installs the release's own program file for the machine instead of building it. Each one is
# the program itself (pkg-fmt "bin"). The Linux ones are linked statically (musl), so one file serves glibc and musl
# systems alike; garrett-macos is one file for Apple silicon and Intel.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-linux-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-linux-aarch64"

[package.metadata.binstall.overrides.armv7-unknown-linux-gnueabihf]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-linux-armv7"

[package.metadata.binstall.overrides.armv7-unknown-linux-musleabihf]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-linux-armv7"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-macos"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-macos"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/garrett-windows.exe"

# Every outside library is listed here and in NOTICES.md with its licence, and pinned by Cargo.lock.
[dependencies]
regex = "1"
serde_json = "1"
sha2 = "0.10"
# HTTPS to the service: rustls with the ring provider, and the public certificate authorities (the Mozilla list).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The signature on the update list (Ed25519). The same library rustls already uses.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
