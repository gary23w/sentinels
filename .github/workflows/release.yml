# Build a garrett release from the commit this runs on, test every package, and, for a tag, sign it and publish
# it everywhere. What the build leaves is one download, "release", with everything ready to sign:
#
#   dist/   what goes on the GitHub release: the Debian packages, the bundles, the program files, SHA256SUMS
#   site/   what goes on the project's site: the apt repository, the installers, the update list, the manual
#
# For a tag (v1.2.3), once every check has passed, "publish" signs it with the project's keys and publishes it: the
# site (apt, pacman, rpm, Scoop's manifest, the installers, the update list agents follow), the GitHub release, the
# Homebrew tap and the Scoop bucket, then winget, Chocolatey and the AUR; "container" then publishes the image.
# The keys are secrets of the GitHub environment "release", which only tags v* may use. Whoever can push such a tag
# or change those secrets can put a program on every machine that updates itself from the site.
#
# Run by hand (gh workflow run release.yml --ref <branch>) it builds and tests everything and publishes nothing.
# The same signing and publishing can still be done on a machine that holds the keys:
#                                             powershell -File packaging\sign-windows.ps1 -Thumbprint <thumbprint> <folder>
#                                             sh packaging/sign-release.sh <folder>
#                                             sh packaging/publish-release.sh <folder>
#                                             sh packaging/submit-packages.sh <folder> winget|aur|chocolatey
# sign-windows.ps1 signs the Windows agent and the Windows one-file service installer (Authenticode) with the
# project's code-signing certificate; it is skipped while there is no certificate, here and in "publish".
#
#   garrett-linux-x86_64, garrett-linux-aarch64   statically linked (musl): they run on any Linux of that processor
#   garrett-linux-armv7                           the same for 32-bit ARM boards and devices, built and tested by
#                                                 cross-compiling (the tests run under an emulated processor)
#   garrett-macos                                 one file for Apple silicon and Intel
#   garrett-windows.exe                           64-bit Windows, with no runtime to install
#   garrett-installer-*                           the stub of the one-file service installers (packaging/installer), one for
#                                                 Linux x86_64, Linux aarch64 and Windows; assemble-release.sh fills them
#   garrett-windows.msi                           the Windows Installer package (packaging/windows/garrett.wxs) that
#                                                 winget and Chocolatey install, tried on the Windows machine that built
#                                                 it, which also packs the Chocolatey packages: garrett, and
#                                                 sentinels, the alias that installs it
#
# assemble packs the rest, and builds the pacman and rpm packages and the files for Homebrew, Scoop, winget and the
# AUR (packaging/build-packages.sh). Each package is installed and removed again before the release is kept: apt,
# pacman, dnf and zypper in their systems' containers, Homebrew on a Mac, Scoop and the Windows Installer package
# and Chocolatey on Windows.
#
# The folders of the build machines are not kept in the program files: they are written as `home` and `garrett`.
name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, name: garrett-linux-x86_64, installer: garrett-installer-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: garrett-linux-aarch64, installer: garrett-installer-linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup target add ${{ matrix.target }}
      - name: Test
        run: |
          (cd rust && cargo test --release --locked)
          # The stub of the one-file service installer.
          (cd packaging/installer && cargo test --release --locked)
      - name: Build
        run: |
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$HOME=home --remap-path-prefix=$GITHUB_WORKSPACE=garrett"
          cd rust && cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/garrett ../${{ matrix.name }}
          file ../${{ matrix.name }}
          ../${{ matrix.name }} version
          # The stub of the one-file service installer, for the same processor.
          cd ../packaging/installer && cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/garrett-installer ../../${{ matrix.installer }}
          ../../${{ matrix.installer }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer }}
          path: ${{ matrix.installer }}
  linux-armv7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: cargo install cross --locked --version 0.2.5
      - name: Test
        run: |
          # One test compares the agent's signal table with the service's: the build container is shown that folder.
          export CROSS_CONTAINER_OPTS="--volume $GITHUB_WORKSPACE/server:/server:ro"
          cd rust && cross test --release --locked --target armv7-unknown-linux-musleabihf
      - name: Build
        run: |
          cd rust && cross build --release --locked --target armv7-unknown-linux-musleabihf
          cp target/armv7-unknown-linux-musleabihf/release/garrett ../garrett-linux-armv7
          file ../garrett-linux-armv7
          file ../garrett-linux-armv7 | grep -q "ARM, EABI5.*statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: garrett-linux-armv7
          path: garrett-linux-armv7
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: cd rust && cargo test --release --locked
      - name: Build
        run: |
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$HOME=home --remap-path-prefix=$GITHUB_WORKSPACE=garrett"
          cd rust
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output ../garrett-macos target/aarch64-apple-darwin/release/garrett target/x86_64-apple-darwin/release/garrett
          file ../garrett-macos
          ../garrett-macos version
      - uses: actions/upload-artifact@v4
        with:
          name: garrett-macos
          path: garrett-macos
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: bash
        run: |
          (cd rust && cargo test --release --locked)
          # The stub of the one-file service installer.
          (cd packaging/installer && cargo test --release --locked)
      - name: Build
        shell: bash
        run: |
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$(cygpath -w "$HOME")=home --remap-path-prefix=$(cygpath -w "$GITHUB_WORKSPACE")=garrett"
          cd rust && cargo build --release --locked
          cp target/release/garrett.exe ../garrett-windows.exe
          ../garrett-windows.exe version
          # The stub of the one-file service installer.
          cd ../packaging/installer && cargo build --release --locked
          cp target/release/garrett-installer.exe ../../garrett-installer-windows.exe
          ../../garrett-installer-windows.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: garrett-windows.exe
          path: garrett-windows.exe
      - name: Windows Installer package
        # packaging/windows/garrett.wxs, with WiX 5. A second package one version newer is built only to check
        # that an upgrade keeps what the agent has.
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          $version = (Select-String -Path rust/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          function Build-Package([string]$v, [string]$out) {
            $code = python -B packaging/package-managers.py product-code $v
            wix build -arch x64 -ext WixToolset.Util.wixext -d Version=$v -d "ProductCode={$code}" -d Agent=garrett-windows.exe -d Root=. -o $out packaging/windows/garrett.wxs
            if ($LASTEXITCODE -ne 0) { throw "The package for $v did not build." }
          }
          Build-Package $version garrett-windows.msi
          $parts = $version.Split('.')
          Build-Package "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)" garrett-windows-next.msi
      - name: The package installs garrett, keeps it through an upgrade, and removes it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Msi([string[]]$arguments) {
            $run = Start-Process msiexec.exe -ArgumentList ($arguments + '/qn', '/norestart', '/l*v', 'msi.log') -Wait -PassThru
            if ($run.ExitCode -notin 0, 3010) { Get-Content msi.log | Select-Object -Last 80; throw "msiexec $arguments ended with $($run.ExitCode)" }
          }
          function Entries { @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'garrett') }
          $command = Join-Path $env:ProgramFiles 'garrett\garrett.cmd'
          $state = Join-Path $env:ProgramData 'garrett'
          Msi '/i', 'garrett-windows.msi'
          & $command status
          if ($LASTEXITCODE -ne 0) { throw 'garrett status failed after the install.' }
          if ((Get-ScheduledTask -TaskName garrett).State -ne 'Running') { throw 'The scheduled task is not running.' }
          if ((Entries).Count -ne 1) { throw 'Apps and Features has no entry for garrett.' }
          $born = (Get-Item -LiteralPath $state -Force).CreationTimeUtc
          Msi '/i', 'garrett-windows-next.msi'
          & $command status
          if ($LASTEXITCODE -ne 0) { throw 'garrett status failed after the upgrade.' }
          if ((Get-Item -LiteralPath $state -Force).CreationTimeUtc -ne $born) { throw 'The upgrade replaced what the agent had.' }
          if ((Entries).Count -ne 1) { throw 'The upgrade left two entries in Apps and Features.' }
          Msi '/x', 'garrett-windows-next.msi'
          if (Get-ScheduledTask -TaskName garrett -ErrorAction SilentlyContinue) { throw 'The scheduled task was left behind.' }
          foreach ($left in (Join-Path $env:ProgramFiles 'garrett'), $state, (Join-Path $env:CommonProgramFiles 'garrett')) { if (Test-Path -LiteralPath $left) { throw "Left behind: $left" } }
          if ((Entries).Count) { throw 'The Apps and Features entry was left behind.' }
          'The package installed garrett, kept it through an upgrade, and removed it.'
      - name: Chocolatey package
        # The one for the release downloads the Windows Installer package from the GitHub release. A copy that
        # installs the one built here instead shows that it installs and removes garrett.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B packaging/package-managers.py chocolatey choco garrett-windows.msi
          choco pack choco/garrett.nuspec --outputdirectory chocolatey --limit-output
          choco pack choco-sentinels/sentinels.nuspec --outputdirectory chocolatey --limit-output
          python -B packaging/package-managers.py chocolatey choco-try garrett-windows.msi --base-url ('file:///' + ($PWD.Path -replace '\\', '/'))
          choco pack choco-try/garrett.nuspec --outputdirectory choco-try-out --limit-output
          choco pack choco-try-sentinels/sentinels.nuspec --outputdirectory choco-try-out --limit-output
          # Installed by its alias: choco install sentinels brings in garrett.
          choco install sentinels --source "$PWD\choco-try-out" --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install sentinels failed.' }
          & (Join-Path $env:ProgramFiles 'garrett\garrett.cmd') status
          if ($LASTEXITCODE -ne 0) { throw 'garrett status failed after choco install.' }
          choco uninstall sentinels garrett --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco uninstall failed.' }
          if (Get-ScheduledTask -TaskName garrett -ErrorAction SilentlyContinue) { throw 'choco uninstall left the scheduled task.' }
          if (Test-Path (Join-Path $env:ProgramFiles 'garrett')) { throw 'choco uninstall left the program folder.' }
          Get-ChildItem chocolatey
      - uses: actions/upload-artifact@v4
        with:
          name: garrett-windows.msi
          path: garrett-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: garrett-chocolatey
          path: chocolatey/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: garrett-installer-windows.exe
          path: garrett-installer-windows.exe

  # Pack what was built: Debian, pacman and rpm packages and their repositories, the Windows Installer package,
  # the bundles, the update list, the site, and the files for the other package managers.
  assemble:
    needs: [linux, linux-armv7, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential debhelper apt-utils lintian mandoc rpm createrepo-c
      - name: Pack
        run: sh packaging/assemble-release.sh built release
      - name: The packages are sound
        run: |
          for deb in release/dist/*.deb; do
            echo "== $(basename "$deb")"
            dpkg-deb -I "$deb" | grep -E "Package|Version|Architecture|Depends"
            lintian "$deb" 2>&1 | grep -v "statically-linked-binary" | cut -c1-170 | head -12
          done
          # Installed by its alias, from the repository just made: apt install sentinels brings in garrett.
          echo "deb [trusted=yes] file://$PWD/release/site stable main" | sudo tee /etc/apt/sources.list.d/release-check.list >/dev/null
          sudo apt-get update -q -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/release-check.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y -q sentinels
          test "$(garrett version)" = "garrett $(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          sudo apt-get purge -y -q garrett
          if dpkg -s sentinels 2>/dev/null | grep -q "Status: install ok installed"; then echo "removing garrett left the alias installed"; exit 1; fi
          sudo rm /etc/apt/sources.list.d/release-check.list
      # Each one installed from its repository, the way a machine that names the repository gets it, on the systems
      # it is for; then removed. Unsigned here: the keys sign the repositories later, off this machine.
      - name: pacman installs and removes garrett from its repository
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          docker run --rm -v "$PWD/release:/r:ro" archlinux:base-devel-20261108.0.623074 sh -exc '
            printf "\n[sentinels]\nSigLevel = Never\nServer = file:///r/site/arch/\$arch\n" >> /etc/pacman.conf
            # By its alias: pacman -S sentinels brings in garrett.
            pacman -Sy --noconfirm sentinels
            test "$(garrett version)" = "garrett '"$V"'"
            test -f /usr/lib/systemd/system/garrett.service
            # The image leaves manual pages out of what it extracts; the package lists it all the same (makepkg gzips it).
            pacman -Ql garrett | grep -Eq " /usr/share/man/man8/garrett\.8(\.gz)?$"
            mkdir -p /var/lib/garrett /etc/garrett && : > /var/lib/garrett/agent.json && : > /etc/garrett/garrett.conf
            pacman -R --noconfirm sentinels garrett
            for left in /usr/lib/garrett /usr/bin/garrett /usr/lib/systemd/system/garrett.service /var/lib/garrett /etc/garrett; do if [ -e "$left" ]; then echo "left behind: $left"; exit 1; fi; done'
      - name: dnf and zypper install and remove garrett from its repository
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          for image in fedora:45 almalinux:9; do
            echo "== $image"
            docker run --rm -v "$PWD/release:/r:ro" "$image" sh -exc '
              printf "[garrett]\nname=garrett\nbaseurl=file:///r/site/rpm\ngpgcheck=0\nrepo_gpgcheck=0\n" > /etc/yum.repos.d/garrett.repo
              # By its alias: dnf install sentinels brings in garrett.
              dnf install -y -q sentinels
              test "$(garrett version)" = "garrett '"$V"'"
              rpm -V garrett
              mkdir -p /var/lib/garrett /etc/garrett && : > /var/lib/garrett/agent.json && : > /etc/garrett/garrett.conf
              dnf remove -y -q garrett
              if rpm -q sentinels; then echo "removing garrett left the alias installed"; exit 1; fi
              for left in /usr/lib/garrett /usr/bin/garrett /var/lib/garrett /etc/garrett; do if [ -e "$left" ]; then echo "left behind: $left"; exit 1; fi; done'
          done
          echo "== opensuse/tumbleweed"
          docker run --rm -v "$PWD/release:/r:ro" opensuse/tumbleweed sh -exc '
            zypper --non-interactive --quiet addrepo --no-gpgcheck file:///r/site/rpm garrett
            zypper --non-interactive --quiet install sentinels
            test "$(garrett version)" = "garrett '"$V"'"
            zypper --non-interactive --quiet remove sentinels garrett
            test ! -e /usr/lib/garrett && test ! -e /var/lib/garrett'
      - name: Nothing in it says where it was built
        run: |
          if grep -rIl -e "/home/runner" -e "runneradmin" -e "/Users/runner" release; then echo "a build folder is named in a published file"; exit 1; fi
          if grep -rl -a -e "/home/runner/work" -e "D:\\a\\" release/dist/garrett-linux-* release/dist/garrett-macos release/dist/garrett-windows.exe release/dist/garrett-windows.msi release/dist/*.rpm release/packages/chocolatey/*.nupkg; then echo "a build folder is named in a program file or package"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
      # What the Homebrew and Scoop checks below need: the bundles they install and the release's digests.
      - uses: actions/upload-artifact@v4
        with:
          name: package-checks
          path: |
            release/dist/SHA256SUMS
            release/dist/garrett-macos.tar.gz
            release/dist/garrett-windows.zip

  # Homebrew installs garrett from the formula this release publishes to the tap, and the install line in its
  # caveats sets garrett up as a root LaunchDaemon in a root-owned folder.
  homebrew:
    needs: assemble
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-checks
          path: release/dist
      - name: brew install, then the install line, then removal
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          python3 -B packaging/package-managers.py render release --base-url "file://$PWD/release/dist"
          brew tap-new --no-git local/sentinels >/dev/null
          TAP="$(brew --repository)/Library/Taps/local/homebrew-sentinels"
          cp release/packages/homebrew/garrett.rb "$TAP/Formula/garrett.rb"
          # By its full name, which is what trusts it: Homebrew loads a third-party tap's formula only when trusted.
          brew install local/sentinels/garrett
          brew test local/sentinels/garrett
          sudo sh "$(brew --prefix)/opt/garrett/libexec/install.sh"
          ROOT="/Library/Application Support/Garrett"
          test "$(stat -f %u "$ROOT/garrett-agent")" = 0
          sleep 5
          sudo launchctl print system/com.garrett.agent | grep -q "state = running"
          sudo "$ROOT/garrett" status
          test "$(sudo "$ROOT/garrett" version)" = "garrett $V"
          sudo sh "$(brew --prefix)/opt/garrett/libexec/install.sh" --remove
          brew uninstall garrett
          for left in "$ROOT" /Library/LaunchDaemons/com.garrett.agent.plist; do if [ -e "$left" ]; then echo "left behind: $left"; exit 1; fi; done

  # Scoop installs garrett from the manifest this release puts on the site, keeps it and what it has through an
  # update (Scoop runs the old version's uninstaller first), and takes it off the machine on scoop uninstall.
  scoop:
    needs: assemble
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-checks
          path: release/dist
      - name: scoop install, update and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B packaging/package-managers.py render release --base-url http://127.0.0.1:8797
          Start-Process python -ArgumentList '-m', 'http.server', '8797', '--bind', '127.0.0.1', '--directory', 'release/dist' -WindowStyle Hidden
          Start-Sleep -Seconds 3
          Invoke-RestMethod https://get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $manifest = Resolve-Path release/site/garrett.json
          $command = Join-Path $env:ProgramFiles 'garrett\garrett.cmd'
          $state = Join-Path $env:ProgramData 'garrett'
          scoop install $manifest
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { throw 'Installing changed the PATH of the shell Scoop ran in.' }
          & $command status
          if ($LASTEXITCODE -ne 0) { throw 'garrett status failed after scoop install.' }
          if ((Get-ScheduledTask -TaskName garrett).State -ne 'Running') { throw 'The scheduled task is not running.' }
          $born = (Get-Item -LiteralPath $state -Force).CreationTimeUtc
          (Get-Content $manifest -Raw) -replace '"version": "([^"]+)"', '"version": "$1.1"' | Set-Content $manifest -NoNewline
          scoop update garrett
          if ((Get-Item -LiteralPath $state -Force).CreationTimeUtc -ne $born) { throw 'The update replaced what the agent had.' }
          & $command status
          if ($LASTEXITCODE -ne 0) { throw 'garrett status failed after scoop update.' }
          scoop uninstall garrett
          if (Get-ScheduledTask -TaskName garrett -ErrorAction SilentlyContinue) { throw 'scoop uninstall left the scheduled task.' }
          foreach ($left in (Join-Path $env:ProgramFiles 'garrett'), $state) { if (Test-Path -LiteralPath $left) { throw "Left behind: $left" } }
          'Scoop installed garrett, kept it through an update, and removed it.'

  # Sign and publish, for a tag only and only after every check above passed. The secrets belong to the environment
  # "release", which only tags v* may use:
  #   PACKAGE_SIGNING_KEY   the OpenPGP package signing key, armored (apt, pacman, rpm, SHA256SUMS)
  #   UPDATE_SIGNING_KEY    the Ed25519 update key, PEM (update.txt, which installed agents follow)
  #   RELEASE_TOKEN         a GitHub token of the project's account: the site, the release, the tap, the bucket, winget
  #   CHOCOLATEY_API_KEY    the community.chocolatey.org account's API key
  #   AUR_SSH_KEY           the private SSH key of the AUR account that keeps garrett-bin
  # A registry whose secret is not set is left out, with a warning; the release goes ahead without it.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [assemble, homebrew, scoop]
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: The tag names the version that was built
        run: test "$GITHUB_REF_NAME" = "v$(sed -n '1s/^garrett //p' release/site/update.txt)"
      - name: Sign
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$PACKAGE_SIGNING_KEY" ] && [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::The release environment has no signing keys."; exit 1; }
          umask 077
          KEYS=$(mktemp -d)
          trap 'GNUPGHOME="$KEYS/gnupg" gpgconf --kill all 2>/dev/null || true; rm -rf "$KEYS"' EXIT
          mkdir "$KEYS/gnupg"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | GNUPGHOME="$KEYS/gnupg" gpg --batch --quiet --import
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEYS/update.pem"
          GNUPGHOME="$KEYS/gnupg" GARRETT_UPDATE_KEY="$KEYS/update.pem" sh packaging/sign-release.sh release
      - name: Publish the site, the GitHub release, the Homebrew tap and the Scoop bucket
        id: publish
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::The release environment has no RELEASE_TOKEN."; exit 1; }
          git config --global user.name sentinels
          git config --global user.email noreply@sentinels.invalid
          git config --global credential.https://github.com.helper '!gh auth git-credential'
          sh packaging/publish-release.sh release
      # Each registry is tried even when another one failed; the job fails if any did.
      - name: winget (a pull request to microsoft/winget-pkgs)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: sh packaging/submit-packages.sh release winget
      - name: Chocolatey
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          [ -n "$CHOCOLATEY_API_KEY" ] || { echo "::warning::No CHOCOLATEY_API_KEY: Chocolatey left out."; exit 0; }
          sh packaging/submit-packages.sh release chocolatey
      - name: AUR (garrett-bin)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          [ -n "$AUR_SSH_KEY" ] || { echo "::warning::No AUR_SSH_KEY: the AUR left out."; exit 0; }
          umask 077
          KEYS=$(mktemp -d)
          trap 'rm -rf "$KEYS"' EXIT
          printf '%s\n' "$AUR_SSH_KEY" > "$KEYS/aur"
          # The AUR's own host key, kept in the repository: the push goes nowhere else.
          export GIT_SSH_COMMAND="ssh -i $KEYS/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/packaging/arch/aur-known-hosts"
          sh packaging/submit-packages.sh release aur

  # The container image for each processor, with the release's own program in it (packaging/container/Dockerfile):
  # ghcr.io/<owner>/garrett:<version> and :latest, published with this repository's own token.
  container:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: The image's folder
        run: |
          mkdir -p image/linux
          cp release/dist/garrett-linux-x86_64 release/dist/garrett-linux-aarch64 release/dist/garrett-linux-armv7 image/linux/
          cp packaging/container/Dockerfile deploy/entrypoint.sh image/
          echo "IMAGE=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/garrett" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=garrett
            org.opencontainers.image.description=garrett, the agent of sentinels
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
