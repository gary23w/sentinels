{{- if not .Values.enrolment.existingSecret -}}
# The service's address and enrolment key, which each node enrols with the first time its pod starts.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garrett.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garrett.labels" . | nindent 4 }}
stringData:
  server: {{ required "Set enrolment.server to your Sentinel service's address (or enrolment.existingSecret)." .Values.enrolment.server | toString | quote }}
  key: {{ required "Set enrolment.key to your service's enrolment key (or enrolment.existingSecret)." .Values.enrolment.key | toString | quote }}
{{- end }}
